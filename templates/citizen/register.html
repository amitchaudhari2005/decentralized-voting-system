<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Citizen Registration</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/glass.css') }}">

<style>

body {
font-family: Arial, sans-serif;
color: white;
margin:0;
padding:0;
background: linear-gradient(135deg,#1e3c72,#2a5298);
}

.container {
display:flex;
justify-content:center;
align-items:center;
padding:40px;
min-height:100vh;
}

.form-box {
width:650px;
background: rgba(255,255,255,0.15);
backdrop-filter: blur(10px);
padding:30px;
border-radius:20px;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

h1 {
text-align:center;
margin-bottom:20px;
}

input, textarea {
width:100%;
padding:10px;
margin-bottom:12px;
border:none;
border-radius:8px;
outline:none;
}

button {
padding:12px;
border:none;
border-radius:10px;
background:orange;
color:white;
font-size:16px;
cursor:pointer;
margin-bottom:10px;
transition:0.3s;
}

button:hover {
background:darkorange;
transform:scale(1.02);
}

.otp-row {
display:flex;
gap:10px;
}

.token-box {
background: rgba(0,0,0,0.3);
padding:10px;
border-radius:10px;
margin-bottom:15px;
text-align:center;
}

small {
color: #ffdddd;
}

</style>

</head>

<body>

<div class="container">

<div class="form-box">

<h1>🧾 Citizen Registration</h1>

<!-- TOKEN -->
<div class="token-box">
Token: <b>{{ token }}</b>
</div>

<form id="citizenForm"
method="POST"
action="{{ url_for('save_citizen') }}"
enctype="multipart/form-data">

<input type="hidden" name="token" value="{{ token }}">

<!-- NAME -->
<input type="text" name="first_name" placeholder="First Name *" required>
<input type="text" name="middle_name" placeholder="Middle Name">
<input type="text" name="last_name" placeholder="Last Name *" required>

<!-- PARENTS -->
<input type="text" name="father_name" placeholder="Father Name *" required>
<input type="text" name="mother_name" placeholder="Mother Name *" required>

<!-- MOBILE -->
<input type="tel" name="mobile" placeholder="Mobile (10 digits)" pattern="[0-9]{10}" required>

<!-- EMAIL -->
<input type="email" name="email" id="email" placeholder="Email *" required>

<button type="button" onclick="sendOTP()">📧 Send OTP</button>

<!-- OTP -->
<div class="otp-row">
<input type="text" id="otp" placeholder="Enter OTP">
<button type="button" onclick="verifyOTP()">✔ Verify OTP</button>
</div>

<small id="otpStatus"></small>

<!-- VOTER ID -->
<input type="text" name="voter_id" id="voter_id" placeholder="Voter ID *" required>

<!-- ADDRESS -->
<textarea name="address" placeholder="Address" required></textarea>

<!-- PIN -->
<input type="text" name="pincode" pattern="[0-9]{6}" maxlength="6" placeholder="Pincode *" required>

<!-- PHOTO -->
<label>Upload Photo</label>
<input type="file" name="photo" accept="image/*" required>

<!-- SIGNATURE -->
<label>Upload Signature</label>
<input type="file" name="signature" accept="image/*" required>

<button type="submit">Submit Registration</button>

</form>

</div>

</div>

<script>

let otpVerified = false;

/* SEND OTP */
function sendOTP() {

let email = document.getElementById("email").value;

if (!email) {
alert("Enter email first!");
return;
}

fetch("/send-otp", {
method: "POST",
headers: {
"Content-Type": "application/x-www-form-urlencoded"
},
body: `email=${encodeURIComponent(email)}`
})
.then(res => res.json())
.then(data => {
alert(data.message);
document.getElementById("otpStatus").innerText = "OTP sent to email";
});
}

/* VERIFY OTP */
function verifyOTP() {

let otp = document.getElementById("otp").value;

fetch("/verify-otp", {
method: "POST",
headers: {
"Content-Type": "application/x-www-form-urlencoded"
},
body: `otp=${otp}`
})
.then(res => res.json())
.then(data => {

alert(data.message);

if (data.message === "OTP Verified") {
otpVerified = true;
document.getElementById("otpStatus").innerText = "✅ OTP Verified";
document.getElementById("otpStatus").style.color = "lightgreen";
} else {
document.getElementById("otpStatus").innerText = "❌ Invalid OTP";
document.getElementById("otpStatus").style.color = "red";
}

});
}

/* FORM SUBMIT CHECK */
document.getElementById("citizenForm")
.addEventListener("submit", function(e){

if (!otpVerified) {
alert("⚠️ Please verify OTP first!");
e.preventDefault();
return;
}

let voterId = document.getElementById("voter_id").value;
localStorage.setItem("voter_id", voterId);

});

</script>

</body>
</html>
