<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Candidate Forms</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/glass.css') }}">

<style>

.form-container {

display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 20px;

padding: 20px;

}

.candidate-card {

width: 400px;

background: rgba(255,255,255,0.15);

backdrop-filter: blur(10px);

border-radius: 20px;

padding: 20px;

color: white;

box-shadow: 0 8px 32px rgba(0,0,0,0.3);

}

input,
select,
textarea {

width: 100%;

padding: 8px;

margin-bottom: 10px;

border-radius: 8px;

border: none;

}

button {

padding: 12px 20px;

border-radius: 10px;

border: none;

background: orange;

color: white;

font-size: 16px;

cursor: pointer;

}

</style>

</head>

<body>

<h1 style="text-align:center;color:white;">
Candidate Registration Forms
</h1>

<form method="POST"
enctype="multipart/form-data"
action="/candidate/save">

<div class="form-container">

{% for i in range(count) %}

<div class="candidate-card"
style="background:
linear-gradient(135deg,
hsl({{ i*60 }},70%,60%),
hsl({{ i*60+30 }},70%,40%));">

<h2>Candidate {{ i+1 }}</h2>

<label>First Name *</label>
<input type="text"
name="first_name_{{ i }}"
required>

<label>Middle Name</label>
<input type="text"
name="middle_name_{{ i }}">

<label>Last Name *</label>
<input type="text"
name="last_name_{{ i }}"
required>

<label>Father Name *</label>
<input type="text"
name="father_name_{{ i }}"
required>

<label>Mother Name *</label>
<input type="text"
name="mother_name_{{ i }}"
required>

<label>Mobile Number *</label>
<input type="text"
name="mobile_{{ i }}"
maxlength="10"
required>

<label>Email *</label>
<input type="email"
name="email_{{ i }}"
required>

<label>Voter ID *</label>
<input type="text"
name="voter_id_{{ i }}"
required>

<label>Address *</label>
<textarea
name="address_{{ i }}"
required></textarea>

<label>Pin Code *</label>
<input type="text"
name="pincode_{{ i }}"
maxlength="6"
required>

<label>Upload Photo</label>
<input type="file"
name="photo_{{ i }}"
accept="image/*">

<label>Upload Signature</label>
<input type="file"
name="signature_{{ i }}"
accept="image/*">

<label>Select Emoji Symbol</label>

<select name="emoji_{{ i }}">

<option value="🚲">🚲 Bicycle</option>
<option value="🌳">🌳 Tree</option>
<option value="🐘">🐘 Elephant</option>
<option value="⭐">⭐ Star</option>
<option value="🏳️">🏳️ Flag</option>

</select>

<label>Slogan</label>

<input type="text"
name="slogan_{{ i }}">

</div>

{% endfor %}

</div>

<div style="text-align:center;margin:20px;">

<button type="submit">

Submit All Candidates

</button>

</div>

</form>

</body>

</html>
