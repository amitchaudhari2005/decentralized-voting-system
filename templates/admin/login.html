<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Admin Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/glass.css') }}">

<style>

.container {

display:flex;
justify-content:center;
align-items:center;

height:100vh;

color:white;

}

.login-box {

background: rgba(255,255,255,0.15);

backdrop-filter: blur(10px);

padding:40px;

border-radius:20px;

width:350px;

text-align:center;

box-shadow:0 8px 32px rgba(0,0,0,0.3);

}

input {

width:100%;

padding:10px;

margin-bottom:15px;

border:none;

border-radius:8px;

}

button {

padding:12px;

width:100%;

border:none;

border-radius:10px;

background:orange;

color:white;

font-size:16px;

cursor:pointer;

}

.error {

color:red;

margin-bottom:10px;

}

</style>

</head>

<body>

<div class="container">

<div class="login-box">

<h1>🔐 Admin Login</h1>

{% if error %}

<p class="error">{{ error }}</p>

{% endif %}

<form method="POST">

<input type="text"
name="username"
placeholder="Username"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

</div>

</div>

</body>

</html>
